    options: ["None", "A little", "Some", "A lot", "Most"]
    truth_option: "A lot | Most"
    truth_source: "IPCC AR6 WG1 (2021), Figure SPM.1 (appendix K.3: 'Most (if not all)')"
    truth_note: "Figure 6 counts 'A lot' or 'Most' as correct (the supplement's 'A lot' + 'Most' shares reproduce the Figure 6 value in all 20 countries, within rounding); appendix K.3 lists the correct answer as 'Most (if not all)'. Respondents answering 'No' to Q45 are in 'None' (Q46 is asked only if Q45 = Yes).; control group only (respondents who saw no pedagogical video); n_country is the full country sample from the supplement, the control-group n is not printed"
    include_in_main: true
