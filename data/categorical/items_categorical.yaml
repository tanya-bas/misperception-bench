    options: ["Beef/meat ranked 1 (most)", "Beef/meat not ranked 1"]
    truth_option: "Beef/meat ranked 1 (most)"
    truth_source: "Poore and Nemecek (2018), Science 360:987 (appendix K.3: Beef [India: Lamb] (1), Chicken wings (2), Pasta [Asia: rice] (3))"
    truth_note: "binary indicator as printed in Figure 6; only the share of correct answers is published; control group only (respondents who saw no pedagogical video); n_country is the full country sample from the supplement, the control-group n is not printed"
    include_in_main: true
