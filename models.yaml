# v0 model list: three small open-weight instruct models, run locally with Apple MLX (mlx-lm)
# from pre-quantised mlx-community builds on Hugging Face. Verified via the Hugging Face API on
# 2026-11-22: all three repos are ungated; sizes are the sum of repo files. Total 33.3 GB.
#
# Flat YAML only: one "- key: value" block per model, no nesting (run.py has a tiny parser; PyYAML
# is not installed). thinking_kwargs is a JSON string passed to tokenizer.apply_chat_template.
#
# Model choice (user decision 2026-11-22): gpt-oss-20b, a Qwen of comparable size, and a small
# Qwen. Qwen3.8 ships only a 27B dense model and a very large "Flash-Next" MoE on mlx-community,
# and Qwen3.6 has no dense model under 27B, so the small Qwen is Qwen3.5-9B, the newest
# generation with a 4B-9B dense build (substitution recorded below).
# Planned, not included yet: Mistral Small 4 (119B, 68 GB at 4-bit, too large), GLM-5.3-Flash
# (204 GB at 4-bit), DeepSeek V4.1 Flash (553 GB at 4-bit); the OpenRouter list in
# models_openrouter.yaml covers them when a key is available.
#
# Sampling: temperature and top_p follow each model card's recommendation for non-thinking
# chat (Qwen: 0.7 / 0.8; gpt-oss: 1.0 / 1.0). run.py seeds MLX with 1000 + sample index.
# max_tokens: 64 is plenty for a number plus a short preamble when thinking is off; gpt-oss cannot
# switch reasoning off (reasoning_effort=low only), so it gets 512 and providers.split_reasoning
# keeps only the final-channel answer.

- model_id: qwen3.5-9b
  provider: local_mlx
  repo: mlx-community/Qwen3.5-9B-4bit
  family: Qwen (Alibaba)
  size_class: small dense (9B)
  quantization: 4-bit MLX
  disk_gb: 6.0
  thinking_kwargs: '{"enable_thinking": false}'
  thinking_note: chat template supports enable_thinking; set false, so no <think> block
  max_tokens: 64
  temperature: 0.7
  top_p: 0.8
  substitution: paper lists Qwen3.8 small models; no Qwen3.8/3.6 dense build under 27B on mlx-community, so Qwen3.5-9B

- model_id: qwen3.8-27b
  provider: local_mlx
  repo: mlx-community/Qwen3.8-27B-4bit
  family: Qwen (Alibaba)
  size_class: medium dense (27B)
  quantization: 4-bit MLX
  disk_gb: 16.1
  thinking_kwargs: '{"enable_thinking": false}'
  thinking_note: chat template supports enable_thinking and reasoning_effort; enable_thinking=false
  max_tokens: 64
  temperature: 0.7
  top_p: 0.8
  substitution: none (exact paper model, 4-bit quantised)

- model_id: gpt-oss-20b
  provider: local_mlx
  repo: mlx-community/gpt-oss-20b-MXFP4-Q4
  family: gpt-oss (OpenAI)
  size_class: medium MoE (21B, 3.6B active)
  quantization: MXFP4 experts, 4-bit rest (MLX)
  disk_gb: 11.2
  thinking_kwargs: '{"reasoning_effort": "low"}'
  thinking_note: harmony template; reasoning cannot be disabled, effort=low; answer taken from the final channel
  max_tokens: 512
  temperature: 1.0
  top_p: 1.0
  substitution: paper lists gpt-oss-120b (65 GB at 4-bit); the 20b sibling is used
